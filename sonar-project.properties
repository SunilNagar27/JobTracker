sonar.projectKey=jobtracker
sonar.projectName=JobTracker

# Analyse source only, never dependencies or build output
sonar.sources=client/src,server
sonar.exclusions=**/node_modules/**,client/dist/**,**/*.test.js,**/*.svg,**/*.css
sonar.sourceEncoding=UTF-8

# sonar.host.url comes from the SONAR_HOST_URL environment variable
# and the token from SONAR_TOKEN (set by the Jenkins pipeline).
